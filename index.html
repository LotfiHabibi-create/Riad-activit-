<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activité interactive-Français-</title>
<style>
:root{
  --pink:#ec4899;--purple:#7c3aed;--blue:#0ea5e9;--green:#16a34a;--yellow:#eab308;--red:#ef4444;
  --bg:#f0f9ff;--card:#ffffff;--text:#1e293b;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{margin:0;font-family:'Comic Sans MS',Verdana,sans-serif;background:var(--bg);color:var(--text);color-scheme:light;}
header{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;padding:16px;text-align:center;
  position:sticky;top:0;z-index:10;padding-top:calc(16px + env(safe-area-inset-top,0px));}
header h1{margin:0;font-size:1.4rem;}
header p{margin:4px 0 0;font-size:.85rem;opacity:.9;}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:#fff;position:sticky;top:64px;z-index:9;
  overflow-x:auto;box-shadow:0 2px 4px rgba(0,0,0,.05);}
nav button{border:none;padding:8px 12px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:.8rem;
  background:#e2e8f0;color:#334155;white-space:nowrap;}
nav button.active{background:var(--purple);color:#fff;}
#groupnav{position:sticky;top:0;z-index:11;padding:12px 10px;justify-content:center;}
#groupnav button{font-size:.95rem;padding:10px 22px;border-radius:24px;}
#groupnav button.active{background:var(--pink);}
#nav{top:108px;}
main{max-width:700px;margin:0 auto;padding:14px;}
.section{display:none;}
.section.active{display:block;animation:fade .3s;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);
  border-left:6px solid var(--purple);}
.card h2{margin-top:0;font-size:1.1rem;}
.recap{font-size:.9rem;line-height:1.5;}
.recap b{color:var(--pink);}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin:8px 0;}
td,th{border:1px solid #ddd;padding:4px 6px;text-align:center;}
th{background:#f1f5f9;}
.q{margin-bottom:12px;padding:10px;background:#f8fafc;border-radius:10px;}
.q p{margin:0 0 6px;font-weight:bold;font-size:.9rem;}
.opts label{display:block;padding:6px 8px;margin:4px 0;background:#fff;border:2px solid #e2e8f0;border-radius:8px;
  cursor:pointer;font-size:.85rem;}
.opts input{margin-right:6px;}
.fillrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.9rem;margin-bottom:10px;}
.fillrow input[type=text]{padding:5px 8px;border:2px solid #cbd5e1;border-radius:8px;width:110px;font-size:.9rem;}
.btnbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
button.action{background:var(--green);color:#fff;border:none;padding:9px 16px;border-radius:20px;font-weight:bold;cursor:pointer;}
button.reset{background:var(--red);}
.result{margin-top:10px;font-weight:bold;font-size:.95rem;}
.correct{background:#dcfce7 !important;border-color:var(--green) !important;}
.wrong{background:#fee2e2 !important;border-color:var(--red) !important;}
.mascot{font-size:2rem;}
.badge{display:inline-block;background:var(--yellow);color:#333;padding:2px 8px;border-radius:10px;font-size:.75rem;margin-left:6px;}
.mem{background:#fdf4ff;border-left-color:var(--pink);font-size:.85rem;}
button.game{background:linear-gradient(135deg,var(--yellow),#f97316);color:#fff;}
#gameOverlay{position:fixed;inset:0;background:rgba(15,23,42,.85);z-index:50;display:none;
  align-items:center;justify-content:center;padding:16px;}
#gameOverlay.show{display:flex;}
.gamebox{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;text-align:center;}
#gTimer{font-size:1.6rem;font-weight:bold;color:var(--red);margin-bottom:6px;}
#gTimerBar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-bottom:14px;}
#gTimerFill{height:100%;background:var(--green);width:100%;transition:width .3s linear;}
#gQ{font-size:1.05rem;font-weight:bold;margin-bottom:14px;}
#gOpts button{display:block;width:100%;padding:10px;margin:6px 0;border-radius:10px;border:2px solid #cbd5e1;
  background:#f8fafc;color:var(--text);cursor:pointer;font-size:.9rem;font-family:inherit;}
#gScore{font-size:1.1rem;font-weight:bold;margin-top:10px;}
#gClose{margin-top:14px;background:#64748b;color:#fff;border:none;padding:8px 18px;border-radius:20px;cursor:pointer;}
.stars{font-size:.7rem;margin-left:3px;}
#challengeBar{text-align:center;padding:8px 10px;}
#challengeBar button{background:linear-gradient(135deg,#f97316,var(--pink));color:#fff;border:none;
  padding:10px 18px;border-radius:22px;font-weight:bold;cursor:pointer;font-size:.85rem;}
footer{text-align:center;padding:20px;font-size:.8rem;color:#64748b;}
</style>
</head>

{id:"grammaire",group:"gram",title:"Grammaire générale",color:"#0891b2",
 recap:`<p><b>Phrase nominale</b> : pas de verbe conjugué (Quel beau paysage !). <b>Phrase verbale</b> : contient un verbe conjugué (Il pleut).</p>
 <p><b>Adjectif qualificatif</b> : donne des précisions sur le nom, s'accorde en genre/nombre (un grand garçon, une grande fille).</p>
 <p><b>Phrase interrogative</b> : se termine par « ? ». 3 façons : intonation (Tu viens ?), est-ce que (Est-ce que tu viens ?), inversion (Viens-tu ?).</p>
 <p><b>Compléments du verbe</b> : <b>COD</b> répond à qui/quoi ? sans préposition (Lina lit un livre). <b>COI</b> répond à à qui/de quoi ? avec préposition (Je parle à mon ami).</p>
 <p><b>Adjectifs possessifs</b> (mon, ta, son, notre, vos, leurs = possession) vs <b>démonstratifs</b> (ce, cette, cet, ces = pointage/identification).</p>
 <p><b>Discours indirect</b> : on rapporte des paroles sans les répéter exactement (il dit : « je suis malade » → il dit qu'il est malade).</p>
 <p><b>Subordonnées de cause</b> (parce que, car, comme, grâce à) et <b>de conséquence</b> (si bien que, donc, c'est pourquoi).</p>`,

              gram:{label:"📘 Grammaire",subtitle:"Phrase, adjectifs, compléments, discours indirect, subordonnées"},
              orth:{label:"🔤 Orthographe",subtitle:"Homophones grammaticaux et règles d'orthographe"},
              lex:{label:"📖 Lexique",subtitle:"Vocabulaire : synonymes, antonymes, familles de mots"},
              oral:{label:"🗣️ Oral",subtitle:"Expressions et formules pour s'exprimer à l'oral"},
              prod:{label:"✍️ Production écrite",subtitle:"Structurer et rédiger un texte"}};
Object.keys(groups).forEach(g=>{

});
sections.forEach((s,i)=>{

  b.className='navg-'+s.group;
  b.id='nav-'+s.id; nav.appendChild(b);

  const sec=document.createElement('div');

    <div class="card mem" style="border-left-color:${s.color}"><h2>📘 ${s.title}</h2><div class="recap">${s.recap}</div></div>

      <h2>🎮 Jeu chrono <span class="badge">10s / question</span></h2>
      <p style="font-size:.85rem;">Réponds le plus vite possible aux questions mélangées !</p>
      <div class="btnbar">
        <button class="action game" onclick="startGame('${s.id}')">▶️ Jeu chrono</button>
        <button class="action" style="background:var(--blue)" onclick="startVF('${s.id}')">✅❌ Vrai/Faux</button>
        <button class="action" style="background:#334155" onclick="startHangman('${s.id}')">🔤 Pendu</button>
        <button class="action" style="background:#9333ea" onclick="startMemory('${s.id}')">🧠 Memory</button>
        <button class="action" style="background:#0d9488" onclick="startFlash('${s.id}')">📇 Flashcards</button>
        <button class="action" style="background:#ea580c" onclick="startOrder('${s.id}')">🔀 Remets l'ordre</button>
        <button class="action" style="background:#be123c" onclick="startSpeed('${s.id}')">⌨️ Course contre la montre</button>
        <button class="action" style="background:#4338ca" onclick="startWheel('${s.id}')">🎡 Roue des questions</button>
      </div>
    </div>
    <div class="card" style="border-left-color:${s.color}">
      <h2>🎯 Quiz <span class="badge">${s.quiz.length} questions</span></h2>
      <form id="quiz-${s.id}">
        ${s.quiz.map((q,qi)=>`
        <div class="q" data-a="${q.a}">
          <p>${qi+1}. ${q.q}</p>
          <div class="opts">
            ${q.o.map((op,oi)=>`<label><input type="radio" name="q${s.id}-${qi}" value="${oi}"> ${op}</label>`).join('')}

      </form>

function showGroup(g){
  currentGroup=g;
  Object.keys(groups).forEach(k=>document.getElementById('gnav-'+k).classList.toggle('active', k===g));
  document.querySelectorAll('#nav button').forEach(b=>b.style.display = b.classList.contains('navg-'+g) ? 'inline-block' : 'none');
  document.getElementById('subtitle').textContent = groups[g].subtitle;
  const first = sections.find(s=>s.group===g);
  if(first) show(first.id);
  updateStars();
}
function show(id){
  sections.forEach(s=>{
    document.getElementById('sec-'+s.id).classList.toggle('active', s.id===id);
    document.getElementById('nav-'+s.id).classList.toggle('active', s.id===id);
  });
  window.scrollTo(0,0);
}
let currentGroup='conj';
showGroup('conj');
function updateStars(){
  sections.forEach(s=>{
    const b=document.getElementById('nav-'+s.id);
    const pct=parseInt(localStorage.getItem('score-'+s.id)||'0');
    const st = pct>=80?'⭐⭐⭐':pct>=50?'⭐⭐':pct>0?'⭐':'';
    b.innerHTML = s.title + (st?` <span class="stars">${st}</span>`:'');
  });
}
updateStars();

function checkQuiz(id){
  const s=sections.find(x=>x.id===id);
  const qs=document.querySelectorAll('#quiz-'+id+' .q');
  let score=0;
  qs.forEach((qd,qi)=>{
    const correct=parseInt(qd.dataset.a);
    const labels=qd.querySelectorAll('.opts label');
    const sel=qd.querySelector('input:checked');
    labels.forEach(l=>l.classList.remove('correct','wrong'));
    if(sel){
      const val=parseInt(sel.value);
      if(val===correct){score++; sel.parentElement.classList.add('correct');}
      else{sel.parentElement.classList.add('wrong'); labels[correct].classList.add('correct');}
    } else {
      labels[correct].classList.add('correct');
    }
  });
  document.getElementById('res-'+id).textContent = `Score : ${score} / ${qs.length} ${score===qs.length?'🎉 Bravo !':'— continue tes efforts !'}`;
}
function resetQuiz(id){
  document.querySelectorAll('#quiz-'+id+' input[type=radio]').forEach(r=>r.checked=false);
  document.querySelectorAll('#quiz-'+id+' .opts label').forEach(l=>l.classList.remove('correct','wrong'));
  document.getElementById('res-'+id).textContent='';
}
function norm(s){return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function checkFill(id){
  const s=sections.find(x=>x.id===id);
  let score=0;
  s.fill.forEach((f,fi)=>{
    const inp=document.getElementById('fill-'+id+'-'+fi);
    if(norm(inp.value)===norm(f[1])){score++; inp.style.borderColor='var(--green)'; inp.style.background='#dcfce7';}
    else{inp.style.borderColor='var(--red)'; inp.style.background='#fee2e2'; inp.title='Réponse : '+f[1];}
  });
  document.getElementById('fres-'+id).textContent = `Score : ${score} / ${s.fill.length}`;
}

/* ---- Jeu chrono ---- */
let game={items:[],idx:0,score:0,timer:null,timeLeft:10,target:null};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(target){
  document.getElementById('gTimerRow').style.display='';
  document.getElementById('gOpts').removeAttribute('style');
  const isGroup = target==='conj'||target==='gram';
  const pool = isGroup ? sections.filter(s=>s.group===target).flatMap(s=>s.quiz) : sections.find(x=>x.id===target).quiz;
  game.target=target;
  game.items=shuffle(pool.map(q=>({q:q.q,o:shuffle(q.o.map((op,i)=>({t:op,c:i===q.a}))) })));
  if(isGroup) game.items=game.items.slice(0,10);
  game.idx=0; game.score=0;
  document.getElementById('gameOverlay').classList.add('show');
  document.getElementById('gScore').textContent='';
  document.getElementById('gClose').style.display='none';
  nextGameQ();
}
function nextGameQ(){
  clearInterval(game.timer);
  if(game.idx>=game.items.length){
    document.getElementById('gQ').textContent='';
    document.getElementById('gOpts').innerHTML='';
    document.getElementById('gTimer').textContent='';
    document.getElementById('gTimerFill').style.width='0%';
    const pct=Math.round(100*game.score/game.items.length);
    document.getElementById('gScore').textContent = `🏁 Résultat final : ${game.score} / ${game.items.length} (${pct}%) ${pct>=80?'🏆 Champion !':pct>=50?'👍 Bien joué !':'💪 Réessaie !'}`;
    document.getElementById('gClose').style.display='inline-block';
    if(game.target!=='conj' && game.target!=='gram'){
      const prev=parseInt(localStorage.getItem('score-'+game.target)||'0');
      if(pct>prev) localStorage.setItem('score-'+game.target, pct);
      updateStars();
    }
    return;
  }
  const it=game.items[game.idx];
  document.getElementById('gQ').textContent = `Q${game.idx+1}/${game.items.length} : ${it.q}`;
  const opts=document.getElementById('gOpts');
  opts.innerHTML='';
  it.o.forEach(op=>{
    const b=document.createElement('button');
    b.textContent=op.t;
    b.onclick=()=>answerGame(op.c,b);
    opts.appendChild(b);
  });
  game.timeLeft=10;
  document.getElementById('gTimer').textContent='⏱ '+game.timeLeft;
  document.getElementById('gTimerFill').style.width='100%';
  game.timer=setInterval(()=>{
    game.timeLeft--;
    document.getElementById('gTimer').textContent='⏱ '+game.timeLeft;
    document.getElementById('gTimerFill').style.width=(game.timeLeft*10)+'%';
    if(game.timeLeft<=0){clearInterval(game.timer); answerGame(false,null);}
  },1000);
}
function answerGame(correct,btn){
  clearInterval(game.timer);
  document.querySelectorAll('#gOpts button').forEach(b=>b.disabled=true);
  if(correct){game.score++; if(btn)btn.style.background='#dcfce7'; if(btn)btn.style.borderColor='var(--green)';}
  else if(btn){btn.style.background='#fee2e2'; btn.style.borderColor='var(--red)';}
  game.idx++;
  setTimeout(nextGameQ, 700);
}
function closeGame(){
  clearInterval(game.timer); clearInterval(speed.timer);
  document.getElementById('gameOverlay').classList.remove('show');
}

/* ---- Vrai/Faux express ---- */
function startVF(id){
  document.getElementById('gTimerRow').style.display='';
  document.getElementById('gOpts').removeAttribute('style');
  const s=sections.find(x=>x.id===id);
  const items=[];
  s.quiz.forEach(q=>{
    items.push({q:q.q+' → « '+q.o[q.a]+' »',c:true});
    const wrongIdx = (q.a+1)%q.o.length;
    items.push({q:q.q+' → « '+q.o[wrongIdx]+' »',c:false});
  });
  game.target=id; game.items=shuffle(items).slice(0,8); game.idx=0; game.score=0;
  document.getElementById('gameOverlay').classList.add('show');
  document.getElementById('gScore').textContent='';
  document.getElementById('gClose').style.display='none';
  nextVFQ();
}
function nextVFQ(){
  clearInterval(game.timer);
  if(game.idx>=game.items.length){
    document.getElementById('gQ').textContent='';document.getElementById('gOpts').innerHTML='';
    document.getElementById('gTimer').textContent='';document.getElementById('gTimerFill').style.width='0%';
    const pct=Math.round(100*game.score/game.items.length);
    document.getElementById('gScore').textContent = `🏁 Résultat : ${game.score} / ${game.items.length} (${pct}%) ${pct>=80?'🏆 Champion !':pct>=50?'👍 Bien joué !':'💪 Réessaie !'}`;
    document.getElementById('gClose').style.display='inline-block';
    const prev=parseInt(localStorage.getItem('score-'+game.target)||'0');
    if(pct>prev) localStorage.setItem('score-'+game.target, pct);
    updateStars();
    return;
  }
  const it=game.items[game.idx];
  document.getElementById('gQ').textContent = `${game.idx+1}/${game.items.length} : ${it.q}`;
  const opts=document.getElementById('gOpts'); opts.innerHTML='';
  [['✅ Vrai',true],['❌ Faux',false]].forEach(([label,val])=>{
    const b=document.createElement('button'); b.textContent=label;
    b.onclick=()=>answerVF(val===it.c,b); opts.appendChild(b);
  });
  game.timeLeft=8;
  document.getElementById('gTimer').textContent='⏱ '+game.timeLeft;
  document.getElementById('gTimerFill').style.width='100%';
  game.timer=setInterval(()=>{
    game.timeLeft--;
    document.getElementById('gTimer').textContent='⏱ '+game.timeLeft;
    document.getElementById('gTimerFill').style.width=(game.timeLeft*12.5)+'%';
    if(game.timeLeft<=0){clearInterval(game.timer); answerVF(false,null);}
  },1000);
}
function answerVF(correct,btn){
  clearInterval(game.timer);
  document.querySelectorAll('#gOpts button').forEach(b=>b.disabled=true);
  if(correct){game.score++; if(btn){btn.style.background='#dcfce7';btn.style.borderColor='var(--green)';}}
  else if(btn){btn.style.background='#fee2e2'; btn.style.borderColor='var(--red)';}
  game.idx++;
  setTimeout(nextVFQ, 700);
}

/* ---- Pendu ---- */
let hangman={};
function startHangman(id){
  const s=sections.find(x=>x.id===id);
  let words=[];
  s.quiz.forEach(q=>words.push(q.o[q.a]));
  s.fill.forEach(f=>words.push(f[1]));
  words=words.filter(w=>/^[a-zàâäéèêëîïôöùûüç']+$/i.test(w)).map(w=>w.toLowerCase());
  words=[...new Set(words)].filter(w=>w.length>=3);
  if(!words.length) words=['verbe'];
  hangman={word:words[Math.floor(Math.random()*words.length)],guessed:new Set(),errors:0,max:7,target:id};
  document.getElementById('gTimerRow').style.display='none';
  document.getElementById('gameOverlay').classList.add('show');
  renderHangman();
}
function renderHangman(){
  const masked=hangman.word.split('').map(ch=>hangman.guessed.has(ch)?ch:'_').join(' ');
  document.getElementById('gQ').innerHTML=`🔤 <b style="letter-spacing:4px;font-size:1.3rem">${masked}</b><br><small>❤️ Erreurs : ${hangman.errors}/${hangman.max}</small>`;
  const opts=document.getElementById('gOpts');
  opts.removeAttribute('style'); opts.style.cssText='display:flex;flex-wrap:wrap;gap:4px;justify-content:center';
  opts.innerHTML='';
  'abcdefghijklmnopqrstuvwxyz'.split('').forEach(l=>{
    const b=document.createElement('button');
    b.textContent=l; b.style.cssText='width:30px;padding:6px 0;margin:0;border-radius:6px;border:2px solid #cbd5e1;font-family:inherit;color:var(--text);';
    if(hangman.guessed.has(l)){b.disabled=true; b.style.background=hangman.word.includes(l)?'#dcfce7':'#fee2e2';}
    else b.style.background='#f8fafc';
    b.onclick=()=>guessLetter(l);
    opts.appendChild(b);
  });
  document.getElementById('gScore').textContent='';
  document.getElementById('gClose').style.display='inline-block';
  const won=hangman.word.split('').every(ch=>hangman.guessed.has(ch));
  const lost=hangman.errors>=hangman.max;
  if(won||lost){
    opts.innerHTML='';
    document.getElementById('gScore').textContent = won?'🏆 Bravo, gagné !':`💀 Perdu ! Le mot était : ${hangman.word}`;
  }
}
function guessLetter(l){
  if(hangman.guessed.has(l))return;
  hangman.guessed.add(l);
  if(!hangman.word.includes(l)) hangman.errors++;
  renderHangman();
}

/* ---- Memory ---- */
let memory={};
function startMemory(id){
  const s=sections.find(x=>x.id===id);
  let pairs=s.fill.map(f=>({a:f[0].replace('___','...'),b:f[1]}));
  s.quiz.slice(0,3).forEach(q=>pairs.push({a:q.q.replace('___','...'),b:q.o[q.a]}));
  pairs=pairs.slice(0,6);
  let cards=[];
  pairs.forEach((p,i)=>{cards.push({id:i,text:p.a,type:'a'});cards.push({id:i,text:p.b,type:'b'});});
  memory={cards:shuffle(cards),flipped:[],matched:new Set(),tries:0};
  document.getElementById('gTimerRow').style.display='none';
  document.getElementById('gameOverlay').classList.add('show');
  renderMemory();
}
function renderMemory(){
  document.getElementById('gQ').innerHTML=`🧠 Trouve les paires ! <small>(essais : ${memory.tries})</small>`;
  const opts=document.getElementById('gOpts');
  opts.removeAttribute('style'); opts.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:6px';
  opts.innerHTML='';
  memory.cards.forEach((c,idx)=>{
    const b=document.createElement('button');
    b.style.cssText='min-height:48px;font-size:.72rem;border-radius:8px;border:2px solid #cbd5e1;font-family:inherit;color:var(--text);padding:4px;';
    if(memory.matched.has(c.id)){b.textContent=c.text; b.style.background='#dcfce7'; b.disabled=true;}
    else if(memory.flipped.includes(idx)){b.textContent=c.text; b.style.background='#fef9c3';}
    else{b.textContent='❓'; b.style.background='#f8fafc';}
    b.onclick=()=>flipCard(idx);
    opts.appendChild(b);
  });
  document.getElementById('gScore').textContent = memory.matched.size===memory.cards.length/2 ? `🏆 Bravo ! Terminé en ${memory.tries} essais.` : '';
  document.getElementById('gClose').style.display='inline-block';
}
function flipCard(idx){
  if(memory.flipped.includes(idx)||memory.matched.has(memory.cards[idx].id))return;
  memory.flipped.push(idx);
  renderMemory();
  if(memory.flipped.length===2){
    memory.tries++;
    const [i1,i2]=memory.flipped;
    if(memory.cards[i1].id===memory.cards[i2].id){
      memory.matched.add(memory.cards[i1].id); memory.flipped=[]; renderMemory();
    } else {
      setTimeout(()=>{memory.flipped=[]; renderMemory();},800);
    }
  }
}

/* ---- Flashcards ---- */
let flash={};
function startFlash(id){
  const s=sections.find(x=>x.id===id);
  flash={cards:shuffle(s.quiz.map(q=>({front:q.q,back:q.o[q.a]}))),idx:0,known:0,review:0,showBack:false};
  document.getElementById('gTimerRow').style.display='none';
  document.getElementById('gameOverlay').classList.add('show');
  renderFlash();
}
function renderFlash(){
  const opts=document.getElementById('gOpts'); opts.removeAttribute('style');
  document.getElementById('gClose').style.display='inline-block';
  if(flash.idx>=flash.cards.length){
    document.getElementById('gQ').textContent=''; opts.innerHTML='';
    document.getElementById('gScore').textContent=`🏁 Terminé ! ✅ Su : ${flash.known} | 🔁 À revoir : ${flash.review}`;
    return;
  }
  const c=flash.cards[flash.idx];
  document.getElementById('gQ').innerHTML = `<div onclick="flipFlash()" style="background:#f8fafc;border:2px solid #cbd5e1;border-radius:12px;padding:18px;min-height:60px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;">${flash.showBack?c.back:c.front}</div><small>Carte ${flash.idx+1}/${flash.cards.length} — touche la carte pour ${flash.showBack?'la question':'la réponse'}</small>`;
  opts.innerHTML='';
  document.getElementById('gScore').textContent='';
  if(flash.showBack){
    opts.style.cssText='display:flex;gap:8px;justify-content:center;margin-top:8px;';
    const bK=document.createElement('button'); bK.textContent='✅ Je savais'; bK.style.cssText='background:var(--green);color:#fff;border:none;padding:8px 14px;border-radius:20px;';
    bK.onclick=()=>{flash.known++; flash.idx++; flash.showBack=false; renderFlash();};
    const bR=document.createElement('button'); bR.textContent='🔁 À revoir'; bR.style.cssText='background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:20px;';
    bR.onclick=()=>{flash.review++; flash.idx++; flash.showBack=false; renderFlash();};
    opts.appendChild(bK); opts.appendChild(bR);
  }
}
function flipFlash(){ flash.showBack=!flash.showBack; renderFlash(); }

/* ---- Remets dans l'ordre ---- */
let order={};
function startOrder(id){
  const s=sections.find(x=>x.id===id);
  let sents = s.quiz.map(q=>q.q.replace('___', q.o[q.a]).replace(/\s*\([^)]*\)/g,'').trim())
    .filter(x=>x.split(' ').length>=4);
  order={sentences:shuffle(sents).slice(0,5),idx:0,score:0};
  document.getElementById('gTimerRow').style.display='none';
  document.getElementById('gameOverlay').classList.add('show');
  nextOrder();
}
function nextOrder(){
  document.getElementById('gClose').style.display='inline-block';
  if(!order.sentences.length || order.idx>=order.sentences.length){
    document.getElementById('gQ').textContent=''; document.getElementById('gOpts').innerHTML='';
    document.getElementById('gScore').textContent = order.sentences.length ? `🏁 Score : ${order.score}/${order.sentences.length}` : 'Pas assez de phrases pour ce jeu ici, essaie une autre leçon !';
    return;
  }
  const sent=order.sentences[order.idx];
  const punct = /[.?!]$/.test(sent) ? sent.slice(-1) : '.';
  const words = sent.replace(/[.?!]$/,'').split(' ');
  order.correct=words; order.punct=punct; order.placed=[];
  order.pool=shuffle(words.map(w=>({w})));
  renderOrder();
}
function renderOrder(){
  document.getElementById('gQ').innerHTML = `🔀 Question ${order.idx+1}/${order.sentences.length} — remets la phrase dans l'ordre :<br>
    <div style="min-height:36px;border-bottom:2px dashed #cbd5e1;margin:10px 0;font-weight:bold;">${order.placed.map(p=>p.w).join(' ')}</div>`;
  const opts=document.getElementById('gOpts'); opts.removeAttribute('style');
  opts.style.cssText='display:flex;flex-wrap:wrap;gap:6px;justify-content:center;';
  opts.innerHTML='';
  order.pool.forEach((item,idx)=>{
    const b=document.createElement('button');
    b.textContent=item.w; b.style.cssText='padding:6px 10px;border-radius:8px;border:2px solid #cbd5e1;background:#f8fafc;color:var(--text);font-family:inherit;';
    b.onclick=()=>{order.placed.push(item); order.pool.splice(idx,1); checkOrderDone();};
    opts.appendChild(b);
  });
  document.getElementById('gScore').textContent='';
}
function checkOrderDone(){
  if(order.pool.length===0){
    const built = order.placed.map(p=>p.w).join(' ')+order.punct;
    const correctSent = order.correct.join(' ')+order.punct;
    const ok = norm(built)===norm(correctSent);
    if(ok) order.score++;
    document.getElementById('gOpts').innerHTML='';
    document.getElementById('gQ').innerHTML += `<br><span style="color:${ok?'var(--green)':'var(--red)'}">${ok?'✅ Correct !':'❌ Réponse : '+correctSent}</span>`;
    order.idx++;
    setTimeout(nextOrder, 1500);
  } else {
    renderOrder();
  }
}

/* ---- Course contre la montre ---- */
let speed={timer:null};
function startSpeed(id){
  const s=sections.find(x=>x.id===id);
  let items=shuffle([...s.quiz.map(q=>({q:q.q,a:q.o[q.a]})), ...s.fill.map(f=>({q:f[0],a:f[1]}))]);
  speed={items,idx:0,score:0,timeLeft:60,target:id,timer:null};
  document.getElementById('gTimerRow').style.display='';
  document.getElementById('gameOverlay').classList.add('show');
  document.getElementById('gClose').style.display='none';
  renderSpeed();
  speed.timer=setInterval(()=>{
    speed.timeLeft--;
    document.getElementById('gTimer').textContent='⏱ '+speed.timeLeft;
    document.getElementById('gTimerFill').style.width=(speed.timeLeft/60*100)+'%';
    if(speed.timeLeft<=0) endSpeed();
  },1000);
}
function renderSpeed(){
  if(speed.idx>=speed.items.length){ endSpeed(); return; }
  const it=speed.items[speed.idx];
  document.getElementById('gQ').innerHTML = `⌨️ ${it.q}`;
  const opts=document.getElementById('gOpts'); opts.removeAttribute('style'); opts.innerHTML='';
  const inp=document.createElement('input'); inp.type='text';
  inp.style.cssText='padding:8px;border-radius:8px;border:2px solid #cbd5e1;width:65%;font-size:1rem;color:var(--text);';
  const btn=document.createElement('button'); btn.textContent='OK';
  btn.style.cssText='margin-left:6px;padding:8px 14px;border-radius:8px;background:var(--green);color:#fff;border:none;';
  const submit=()=>{ if(norm(inp.value)===norm(it.a)) speed.score++; speed.idx++; renderSpeed(); };
  btn.onclick=submit;
  inp.onkeydown=(e)=>{if(e.key==='Enter')submit();};
  opts.appendChild(inp); opts.appendChild(btn);
  document.getElementById('gScore').textContent = `Score : ${speed.score}`;
  setTimeout(()=>inp.focus(),50);
}
function endSpeed(){
  clearInterval(speed.timer);
  document.getElementById('gQ').textContent=''; document.getElementById('gOpts').innerHTML='';
  document.getElementById('gTimer').textContent=''; document.getElementById('gTimerFill').style.width='0%';
  document.getElementById('gScore').textContent = `🏁 Temps écoulé ! ${speed.score} bonnes réponses.`;
  document.getElementById('gClose').style.display='inline-block';
  const pct=Math.min(100, speed.score*10);
  const prev=parseInt(localStorage.getItem('score-'+speed.target)||'0');
  if(pct>prev) localStorage.setItem('score-'+speed.target, pct);
  updateStars();
}

/* ---- Roue des questions ---- */
let wheel={};
function startWheel(id){
  wheel={pool:shuffle(sections.find(x=>x.id===id).quiz.slice()),id};
  document.getElementById('gTimerRow').style.display='none';
  document.getElementById('gameOverlay').classList.add('show');
  document.getElementById('gClose').style.display='inline-block';
  renderWheelIntro();
}
function renderWheelIntro(){
  document.getElementById('gQ').innerHTML = `<div id="wheelEl" style="font-size:3rem;transition:transform 2.5s cubic-bezier(.17,.67,.16,1);display:inline-block;">🎡</div><p>Tourne la roue pour tirer une question au hasard !</p>`;
  const opts=document.getElementById('gOpts'); opts.removeAttribute('style'); opts.innerHTML='';
  const b=document.createElement('button'); b.textContent='🎯 Tourner la roue';
  b.style.cssText='background:linear-gradient(135deg,#f97316,var(--pink));color:#fff;border:none;padding:10px 20px;border-radius:22px;font-weight:bold;';
  b.onclick=spinWheel;
  opts.appendChild(b);
  document.getElementById('gScore').textContent='';
}
function spinWheel(){
  const wheelEl=document.getElementById('wheelEl');
  const turns = 3+Math.random()*2;
  wheelEl.style.transform=`rotate(${turns*360}deg)`;
  document.getElementById('gOpts').innerHTML='';
  setTimeout(()=>{
    if(!wheel.pool.length) wheel.pool=shuffle(sections.find(x=>x.id===wheel.id).quiz.slice());
    showWheelQuestion(wheel.pool.pop());
  }, 1500);
}
function showWheelQuestion(q){
  document.getElementById('gQ').innerHTML = `<p style="font-weight:bold;">${q.q}</p>`;
  const opts=document.getElementById('gOpts'); opts.style.cssText='';
  shuffle(q.o.map((op,i)=>({t:op,c:i===q.a}))).forEach(op=>{
    const b=document.createElement('button');
    b.textContent=op.t;
    b.onclick=()=>{
      b.style.background = op.c ? '#dcfce7':'#fee2e2';
      document.querySelectorAll('#gOpts button').forEach(x=>x.disabled=true);
      setTimeout(renderWheelIntro, 1200);
    };
    opts.appendChild(b);
  });
}
</script>
